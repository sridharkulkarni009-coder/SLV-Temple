# ---- About the temple ----
history:
  - en: "Sri Venkateshwara Swamy Temple in Vijayapura (Bijapur) was established in 2016. The presiding deity is a divine, single-stone (Ekashila) Saligrama murti of Lord Venkateshwara."
    kn: "ವಿಜಯಪುರ (ಬಿಜಾಪುರ) ಶ್ರೀ ವೆಂಕಟೇಶ್ವರ ಸ್ವಾಮಿ ದೇವಸ್ಥಾನವು 2016ರಲ್ಲಿ ಸ್ಥಾಪನೆಯಾಯಿತು. ಇಲ್ಲಿನ ಮೂಲ ದೇವರು ಏಕಶಿಲಾ ಸಾಲಿಗ್ರಾಮ ಸ್ವರೂಪದ ಶ್ರೀ ವೆಂಕಟೇಶ್ವರ ಸ್ವಾಮಿ."
  - en: "Before the temple was built, the Lord was worshipped with great devotion in a priest's home. As devotees grew in number, the deity was moved to the present temple in Kulkarni Layout."
    kn: "ದೇವಸ್ಥಾನ ನಿರ್ಮಾಣಕ್ಕೂ ಮೊದಲು ಸ್ವಾಮಿಯನ್ನು ಅರ್ಚಕರ ಮನೆಯಲ್ಲಿ ಅತ್ಯಂತ ಭಕ್ತಿಯಿಂದ ಆರಾಧಿಸಲಾಗುತ್ತಿತ್ತು. ಭಕ್ತರ ಸಂಖ್ಯೆ ಹೆಚ್ಚಾದಂತೆ ಮೂರ್ತಿಯನ್ನು ಇಂದಿನ ಕುಲಕರ್ಣಿ ಲೇಔಟ್‌ನ ದೇವಸ್ಥಾನಕ್ಕೆ ಸ್ಥಳಾಂತರಿಸಲಾಯಿತು."
  - en: "The Prana Pratishtapana (sacred installation) of the deity in the present temple was performed by Sri Sri 1008 Satyatma Tirtha Sripadaru of Uttaradi Math."
    kn: "ಪ್ರಸ್ತುತ ದೇವಸ್ಥಾನದಲ್ಲಿ ಮೂರ್ತಿಯ ಪ್ರಾಣಪ್ರತಿಷ್ಠಾಪನೆಯನ್ನು ಉತ್ತರಾದಿ ಮಠದ ಶ್ರೀ ಶ್ರೀ 1008 ಸತ್ಯಾತ್ಮ ತೀರ್ಥ ಶ್ರೀಪಾದರು ನೆರವೇರಿಸಿದರು."

